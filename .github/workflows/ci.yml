name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # eframe/egui (the gui workspace member) link against these on Linux.
      # libfontconfig1-dev is for plotters' default `ttf` feature (charts,
      # issue #14), which locates system fonts via fontconfig on Linux --
      # Windows/macOS use their own native font APIs instead, so this is
      # Linux-only.
      - name: Install Linux GUI toolkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The web stats dashboard (issue #20) is plain static JS with no
      # build step; its pure data-transform module has its own Node test
      # suite (dashboard/stats-view.test.mjs), run here the same way a
      # contributor would locally: `node --test`, no npm install needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test web dashboard
        run: node --test dashboard/*.test.mjs

  # Code coverage (issue #16): cargo-llvm-cov instruments the same
  # `cargo test --workspace` the check job runs and uploads the result to
  # Codecov, which renders the README badge. `fail_ci_if_error: false`
  # means a Codecov hiccup (or the repo not being activated on
  # codecov.io yet -- see https://codecov.io/gh/daveboyd777/DaveBs-Freecell
  # -- itself a one-time, no-code step) never fails this job or blocks a
  # PR; it only affects whether the badge/report updates.
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Same Linux-only native deps the "Format, lint, and test" job
      # installs, needed to build/test the gui/tui workspace members here.
      - name: Install Linux GUI toolkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Build tui/gui workspace members (dev profile)
        run: cargo build --workspace --exclude freecell
