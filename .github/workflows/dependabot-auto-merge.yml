name: Dependabot auto-merge

# Only ever triggered by a Dependabot-authored PR event, and the `if:`
# below double-checks the actor -- this workflow never runs for a
# human-authored PR.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for patch updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # Reads the PR's Dependabot-authored commit metadata (which
      # dependency, old/new version, update-type) without cloning the
      # repo or parsing anything by hand.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # `gh pr merge --auto` only *enables* auto-merge -- the repo already
      # has "Allow auto-merge" turned on -- so it still waits for the
      # required CI checks (ci.yml's jobs) to pass before GitHub actually
      # merges it. `--merge` matches every other PR in this repo's history
      # (a regular merge commit, not squash or rebase). Minor/major bumps
      # are left for manual review.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"
