# Workspace root. `freecell` (this package: the engine lib + text CLI binary)
# is the implicit root member. `tui` and `gui` (Phase 2, issues #6/#7/#8/#9)
# are separate member crates rather than dependencies/features of this crate
# because their dependency graphs don't coexist cleanly in one Cargo.toml:
# ratatui's crossterm backend does not target wasm32-unknown-unknown (needed
# by gui's WASM build, issue #9), and neither UI toolkit belongs in the pure
# engine's own dependency tree.
[workspace]
members = ["tui", "gui"]
resolver = "2"

[package]
name = "freecell"
version = "0.1.0"
edition = "2021"
authors = ["Dave Boyd <daveboyd777@gmail.com>"]
description = "DaveB's Freecell - a FreeCell card game with classic Microsoft deal numbering, built test-first"
repository = "https://github.com/daveboyd777/DaveBs-Freecell"
license = "MIT"
keywords = ["freecell", "solitaire", "card-game", "game", "cli"]
categories = ["games", "command-line-utilities"]

[dependencies]
# Serializes `stats::Stats` (issue #10) so it can round-trip through JSON.
serde = { version = "1", features = ["derive"] }
# Stats::save/load (issue #11) persist as JSON; promoted from a dev-only
# dependency now that it's used outside tests. The versioned
# `freecell stats --json` CLI export is still issue #19's job.
serde_json = "1"
# The OS-appropriate data directory Stats::save/load defaults to (issue
# #11). Same major version eframe already pulls in as a dev-dependency.
directories = "6.0"
