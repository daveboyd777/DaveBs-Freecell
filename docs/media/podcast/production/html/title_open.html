<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: #0d0c0a; }
  body { font-family: Bahnschrift, 'Segoe UI', sans-serif; color: #d8d2c2; display: flex; align-items: center; justify-content: center; }
  .frame { position: absolute; inset: 60px; border: 3px solid #d8d2c2; }
  .frame2 { position: absolute; inset: 78px; border: 1px solid #8a8474; }
  .corner { position: absolute; width: 90px; height: 90px; border: 3px solid #d8d2c2; }
  .corner.tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
  .corner.tr { top: 40px; right: 40px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 40px; left: 40px; border-right: none; border-top: none; }
  .corner.br { bottom: 40px; right: 40px; border-left: none; border-top: none; }
  .content { text-align: center; }
  .presents { font-size: 30px; letter-spacing: 14px; color: #a49e8c; text-transform: uppercase; margin-bottom: 46px; }
  .title { font-size: 118px; font-weight: 300; letter-spacing: 22px; color: #e9e3d3; text-transform: uppercase; line-height: 1.14; }
  .title .apos { color: #8a8474; }
  .rule { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 52px 0; }
  .rule .line { width: 300px; height: 1px; background: #8a8474; }
  .rule .dia { width: 14px; height: 14px; background: #d8d2c2; transform: rotate(45deg); }
  .subtitle { font-size: 40px; letter-spacing: 10px; color: #c4beac; text-transform: uppercase; }
  .cast { margin-top: 72px; font-size: 26px; letter-spacing: 5px; color: #96907e; line-height: 2.15; text-transform: uppercase; }
  .cast b { color: #cfc9b8; font-weight: 400; }
  .foot { position: absolute; bottom: 108px; left: 0; right: 0; text-align: center; font-size: 20px; letter-spacing: 6px; color: #6e6a5c; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="frame"></div><div class="frame2"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="content">
    <div class="presents">DaveB Presents</div>
    <div class="title">DaveB<span class="apos">’s</span><br>Freecell</div>
    <div class="rule"><div class="line"></div><div class="dia"></div><div class="line"></div></div>
    <div class="subtitle">A Video Podcast in the Thin Man Style</div>
    <div class="cast">
      <b>Dave Boyd</b> as Nick<br>
      <b>Deb Boyd</b> as Nora<br>
      and <b>Asta</b> as himself
    </div>
  </div>
  <div class="foot">An homage after the fashion of the 1934 classic · fifty-two cards · one engine</div>
</body>
</html>
