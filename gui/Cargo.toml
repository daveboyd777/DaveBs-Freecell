[package]
name = "freecell-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
freecell = { version = "0.1.0", path = ".." }
# Renders the statistics charts (issue #14): win-rate trend and
# move-count distribution. Draws into an in-memory RGB buffer (no file
# I/O) for on-screen display via an egui texture; native-only PNG/SVG
# export additionally uses its file-writing backends.
plotters = "0.3"
# Cross-platform `SystemTime`/`UNIX_EPOCH`: real time natively, backed by
# `Date`/`Performance.now()` on wasm32, where `std::time::SystemTime`
# panics. Already an `eframe` dependency; declared directly here too since
# `random_seed` uses it on both targets (issue #9).
web-time = "1.1"

# Only needed for the wasm32 entry point in `main.rs` (issue #9): `eframe`
# itself already brings in and re-exports `wasm_bindgen`/`web_sys` under
# `#[cfg(target_arch = "wasm32")]`. `wasm-bindgen-futures` and `log` are
# used via that re-export and don't need their own entries here; `web-sys`
# is declared explicitly below only to add feature flags `eframe`'s own
# dependency doesn't enable (issue #20).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
log = "0.4"
# `Window::location`/`Location::search` for parsing `?seed=` out of the
# page URL (issue #20's dashboard replay links). `eframe` already depends
# on `web-sys` with a large feature set of its own; declaring it directly
# here too just unifies with that same dependency, adding the two
# features this crate's own code needs.
web-sys = { version = "0.3", features = ["Location", "Window"] }
